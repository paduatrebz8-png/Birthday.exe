<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Birthday Chapter</title>
<style>
  /* ============================================================
     HOW TO CUSTOMIZE THIS TEMPLATE
     Scroll to the bottom of this file to the <script block and
     edit the single CONFIG object. Every name, pronoun, line of
     text, and image comes from there — you never need to touch
     the HTML or CSS to personalize this page.
     ============================================================ */

  :root{
    --bg-0:#050b14;
    --bg-1:#0c1a2b;
    --bg-2:#122238;
    --card:#152840;
    --accent:#2fd66e;
    --accent-dim:#1c8a49;
    --text-hi:#f5f7fa;
    --text-lo:#a8b3c2;
    --text-faint:#6b7789;
    --danger-1:#e0503a;
    --danger-2:#c23a5e;
    --radius-lg:16px;
    --radius-md:10px;
    --radius-sm:6px;
    --maxw:480px;
    font-size:16px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-0);
    color:var(--text-hi);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img{max-width:100%;display:block;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  .hidden{display:none !important;}

  /* ---------- shared page frame ---------- */
  .frame{
    max-width:var(--maxw);
    margin:0 auto;
    min-height:100vh;
    position:relative;
    background:radial-gradient(120% 100% at 50% 0%, var(--bg-2) 0%, var(--bg-1) 45%, var(--bg-0) 100%);
  }

  /* ============================================================
     SCREEN 1 — "Who's listening?"
     ============================================================ */
     
/* ---------- FIRST SCREEN INTRO ---------- */

#screen-who .eyebrow {
  opacity: 0;
  animation: whoTextIn .8s ease forwards;
  animation-delay: .3s;
}

#screen-who .profile-picker {
  opacity: 0;
  transform: translateY(20px) scale(.94);
  animation: whoProfileIn .8s cubic-bezier(.2,.8,.2,1) forwards;
  animation-delay: .65s;
}

#screen-who .avatar {
  animation: whoAvatarGlow 2.5s ease-in-out infinite;
  animation-delay: 1.5s;
}

#screen-who .pname {
  opacity: 0;
  animation: whoNameIn .6s ease forwards;
  animation-delay: 1.15s;
}

@keyframes whoTextIn {
  from {
    opacity: 0;
    transform: translateY(-12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes whoProfileIn {
  from {
    opacity: 0;
    transform: translateY(20px) scale(.94);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes whoNameIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes whoAvatarGlow {
  0%, 100% {
    box-shadow: 0 0 0 rgba(47,214,110,0);
  }
  50% {
    box-shadow: 0 0 28px rgba(47,214,110,.18);
  }
}

  #screen-who{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;text-align:center;padding:24px;gap:40px;
  }
  #screen-who .eyebrow{
    color:var(--text-lo);font-size:1.05rem;font-weight:600;letter-spacing:0.2px;
  }
  .profile-picker{
    display:flex;flex-direction:column;align-items:center;gap:14px;
    cursor:pointer;
  }
  .profile-picker .avatar{
    width:96px;height:96px;border-radius:50%;overflow:hidden;
    background:var(--card);border:2px solid transparent;
    transition:border-color .2s ease, transform .2s ease;
  }
  .profile-picker:hover .avatar{border-color:var(--text-hi);transform:scale(1.03);}
  .profile-picker .avatar img{width:100%;height:100%;object-fit:cover;}
  .profile-picker .pname{color:var(--text-lo);font-weight:600;font-size:.95rem;}

  /* ============================================================
     SCREEN 2 — "Welcome back, {name}!"
     ============================================================ */
  #screen-welcome{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;text-align:center;padding:24px;gap:28px;
  }
  #screen-welcome h1{font-size:1.3rem;font-weight:700;margin:0;}
  #screen-welcome .avatar-lg{
    width:120px;height:120px;border-radius:50%;overflow:hidden;background:var(--card);
  }
  #screen-welcome .avatar-lg img{width:100%;height:100%;object-fit:cover;}
  .pill-btn{
    background:var(--accent);color:#04140a;font-weight:700;font-size:.95rem;
    padding:12px 28px;border-radius:999px;transition:transform .15s ease, background .15s ease;
  }
  .pill-btn:hover{transform:scale(1.04);background:#3ee87f;}
  .pill-btn:active{transform:scale(.97);}

  /* ============================================================
     MAIN APP
     ============================================================ */
  #app{padding-bottom:60px;}


  .nav-right{display:flex;align-items:center;gap:14px;color:var(--text-lo);font-size:1.05rem;}

  /* -- hero -- */
  .hero{padding:28px 20px 8px;}
  .hero-art{
    width:100%;aspect-ratio:1/1;border-radius:var(--radius-md);overflow:hidden;
    background:linear-gradient(145deg,var(--bg-2),var(--bg-0));margin-bottom:18px;
    box-shadow:0 20px 40px -18px rgba(0,0,0,.7);
  }
  .hero-art img{width:100%;height:100%;object-fit:cover;}
  .hero h1{font-size:1.6rem;font-weight:800;margin:0 0 4px;letter-spacing:-.2px;}
  .hero .hero-sub{color:var(--text-lo);font-size:.88rem;font-weight:500;margin:0 0 16px;}
  .hero p{color:var(--text-lo);font-size:.85rem;line-height:1.55;margin:0 0 8px;}
  .hero .now-playing{color:var(--text-faint);font-size:.8rem;margin-top:10px;}
  .hero-controls{
    display:flex;align-items:center;justify-content:space-between;margin-top:18px;
  }
  .hero-controls .preview{display:flex;align-items:center;gap:8px;color:var(--text-lo);font-size:.82rem;}
  .hero-controls .right-icons{display:flex;align-items:center;gap:16px;}
  .icon-btn{color:var(--text-lo);font-size:1.2rem;}
  .play-btn{
    width:52px;height:52px;border-radius:50%;background:var(--accent);
    display:flex;align-items:center;justify-content:center;color:#04140a;font-size:1.3rem;
    transition:transform .15s ease;flex-shrink:0;
  }
  .play-btn:hover{transform:scale(1.06);}
  .play-btn:active{transform:scale(.95);}

  /* -- section heading helper -- */
  .section{padding:34px 20px 0;}
  .section-title{font-size:1.15rem;font-weight:800;margin:0 0 4px;}
  .section-subtitle{color:var(--text-lo);font-size:.8rem;margin:0 0 18px;}

  /* -- about / bio -- */
  .bio-card{display:flex;gap:14px;align-items:flex-start;}
  .bio-photo{
    width:120px;height:150px;border-radius:var(--radius-sm);overflow:hidden;flex-shrink:0;
    background:var(--card);
  }
  .bio-photo img{width:100%;height:100%;object-fit:cover;}
  .bio-body h2{font-size:1.05rem;font-weight:800;margin:0 0 4px;display:flex;align-items:center;gap:6px;}
  .verified{color:#4aa8ff;font-size:.9rem;}
  .bio-body .listeners{color:var(--text-faint);font-size:.75rem;margin:0 0 10px;}
  .bio-body p{color:var(--text-lo);font-size:.78rem;line-height:1.5;margin:0;}

  /* notification banner */
  .notif-banner{
    margin-top:20px;padding:14px 16px;border-radius:var(--radius-md);
    background:linear-gradient(120deg,var(--danger-1),var(--danger-2));
    display:flex;flex-direction:column;gap:10px;
  }
  .notif-banner .notif-title{font-weight:800;font-size:.78rem;letter-spacing:.3px;}
  .notif-banner .notif-text{font-size:.78rem;line-height:1.4;color:rgba(255,255,255,.92);}
  .notif-banner .notif-btn{
    align-self:flex-end;background:rgba(0,0,0,.28);color:#fff;font-weight:700;
    font-size:.72rem;padding:8px 16px;border-radius:999px;transition:background .15s ease;
  }
  .notif-banner .notif-btn:hover{background:rgba(0,0,0,.45);}
  .notif-banner.is-read{opacity:.45;}
  .notif-banner.is-read .notif-btn{pointer-events:none;}

  /* credits card */
  .credits-card{
    margin-top:20px;background:var(--card);border-radius:var(--radius-md);padding:16px;
  }
  .credits-card .credits-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .credits-card .credits-head h3{font-size:.85rem;font-weight:800;margin:0;}
  .credits-card .credits-head span{color:var(--accent);font-size:.72rem;font-weight:700;}
  .credits-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .credits-grid .label{color:var(--text-faint);font-size:.68rem;text-transform:uppercase;letter-spacing:.4px;margin:0 0 3px;}
  .credits-grid .value{color:var(--text-hi);font-size:.78rem;font-weight:600;margin:0;}

  /* tour card */
  .tour-card{
    margin-top:16px;background:var(--card);border-radius:var(--radius-md);padding:16px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .tour-info{display:flex;align-items:center;gap:12px;}
  .tour-date{
    width:46px;height:46px;border-radius:var(--radius-sm);background:var(--bg-0);
    display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;
  }
  .tour-date .m{font-size:.62rem;color:var(--accent);font-weight:800;}
  .tour-date .d{font-size:1rem;font-weight:800;}
  .tour-text .t1{font-size:.8rem;font-weight:700;margin:0;}
  .tour-text .t2{font-size:.72rem;color:var(--text-faint);margin:2px 0 0;}
  .tour-cta{
    background:transparent;border:1px solid var(--text-faint);color:var(--text-hi);
    font-size:.72rem;font-weight:700;padding:8px 14px;border-radius:999px;flex-shrink:0;
  }
  .tour-cta:hover{border-color:var(--text-hi);}

  /* -- letter section -- */
  #letter-section{
    margin-top:34px;padding:26px 20px;background:var(--bg-2);
    display:none;
  }
  #letter-section.revealed{display:block;animation:fadeUp .5s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .letter-grid{display:flex;flex-direction:column;gap:22px;}
  .letter-text h2{font-size:1.25rem;font-weight:800;margin:0 0 14px;}
  .letter-text p{color:var(--text-lo);font-size:.83rem;line-height:1.65;margin:0 0 14px;}
  .letter-text .signoff{color:var(--text-hi);font-style:italic;font-size:.85rem;text-align:right;margin-top:18px;}
  .photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .photo-grid .disc{
    aspect-ratio:1/1;border-radius:50%;overflow:hidden;background:var(--card);
    border:3px solid var(--bg-0);
  }
  .photo-grid .disc img{width:100%;height:100%;object-fit:cover;}

  /* -- VVIP redeemables -- */
  .redeemables-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .redeem-card {
  position: relative;
  aspect-ratio: 1/1;
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: var(--card);
  transition: transform .2s ease;
}

.redeem-card:hover {
  transform: translateY(-3px);
}

.redeem-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.redeem-caption {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 24px 10px 10px;
  background: linear-gradient(transparent, rgba(0, 0, 0, .8));
  color: white;
  font-weight: 800;
  font-size: .78rem;
}

  /* -- album carousel / flip / player -- */
  .carousel-wrap{text-align:center;}
  .carousel-track{
    display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px;
    perspective:1200px;
  }
  .carousel-track .side-art{
    width:64px;height:64px;border-radius:var(--radius-sm);overflow:hidden;
    filter:blur(2px) brightness(.55);flex-shrink:0;
  }
  .carousel-track .side-art img{width:100%;height:100%;object-fit:cover;}
  .flip-card{
    width:210px;height:210px;flex-shrink:0;cursor:pointer;
    transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,.2,.2,1);
    position:relative;
  }
  .flip-card.flipped{transform:rotateY(180deg);}
  .flip-face{
    position:absolute;inset:0;border-radius:var(--radius-md);overflow:hidden;
    backface-visibility:hidden;box-shadow:0 18px 34px -14px rgba(0,0,0,.7);
  }
  .flip-face img{width:100%;height:100%;object-fit:cover;}
  .flip-face.back{transform:rotateY(180deg);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:.75rem;}
  .carousel-hint{color:var(--text-faint);font-size:.78rem;margin:0;}

  .player{display:none;margin-top:26px;text-align:left;}
  .player.visible{display:block;animation:fadeUp .5s ease both;}
  .player-now{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .player-now .pn-art{width:40px;height:40px;border-radius:var(--radius-sm);overflow:hidden;background:var(--card);}
  .player-now .pn-art img{width:100%;height:100%;object-fit:cover;}
  .player-now .pn-title{font-size:.85rem;font-weight:700;margin:0;}
  .player-now .pn-artist{font-size:.72rem;color:var(--text-faint);margin:1px 0 0;}
  .progress-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .progress-row span{font-size:.65rem;color:var(--text-faint);width:32px;}
  .progress-track{flex:1;height:4px;background:var(--card);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;width:0%;background:var(--accent);transition:width .3s linear;}
  .transport{display:flex;align-items:center;justify-content:center;gap:26px;margin-bottom:22px;}
  .transport .tbtn{font-size:1.1rem;color:var(--text-lo);}
  .transport .tplay{
    width:48px;height:48px;border-radius:50%;background:var(--accent);color:#04140a;
    display:flex;align-items:center;justify-content:center;font-size:1.2rem;
  }
  .vinyl-wrap{display:flex;justify-content:center;margin-bottom:22px;}
  .vinyl{
    width:180px;height:180px;border-radius:50%;
    background:
      repeating-radial-gradient(circle at center, #1a1a1a 0 2px, #0a0a0a 2px 4px);
    display:flex;align-items:center;justify-content:center;
    animation:spin 3.2s linear infinite;animation-play-state:paused;
    box-shadow:0 14px 30px -10px rgba(0,0,0,.8);
  }
  .vinyl.spinning{animation-play-state:running;}
  .vinyl .label{width:70px;height:70px;border-radius:50%;overflow:hidden;background:var(--card);}
  .vinyl .label img{width:100%;height:100%;object-fit:cover;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  .tracklist{list-style:none;margin:0;padding:0;}
  .tracklist li{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px;border-radius:var(--radius-sm);gap:10px;
  }
  .tracklist li.active{background:var(--card);}
  .tracklist li .t-idx{width:18px;color:var(--text-faint);font-size:.78rem;flex-shrink:0;}
  .tracklist li.active .t-idx{color:var(--accent);}
  .tracklist li .t-main{flex:1;min-width:0;}
  .tracklist li .t-title{font-size:.82rem;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tracklist li.active .t-title{color:var(--accent);}
  .tracklist li .t-artist{font-size:.7rem;color:var(--text-faint);margin:1px 0 0;}
  .tracklist li .t-dur{font-size:.72rem;color:var(--text-faint);flex-shrink:0;}
  .tracklist li .t-heart{color:var(--text-faint);font-size:.85rem;flex-shrink:0;}
  .tracklist li .t-heart.liked{color:var(--accent);}

  /* -- footer -- */
  .footer{padding:40px 20px 10px;text-align:center;}
  .share-card{
    background:var(--card);border-radius:var(--radius-md);padding:14px;
    display:flex;align-items:center;gap:12px;text-align:left;max-width:340px;margin:0 auto 14px;
  }
  .share-card .sc-art{width:48px;height:48px;border-radius:var(--radius-sm);overflow:hidden;flex-shrink:0;background:var(--bg-0);}
  .share-card .sc-art img{width:100%;height:100%;object-fit:cover;}
  .share-card .sc-title{font-size:.8rem;font-weight:700;margin:0;}
  .share-card .sc-artist{font-size:.7rem;color:var(--text-faint);margin:1px 0 6px;}
  .share-card .sc-lyric{font-size:.72rem;color:var(--text-lo);line-height:1.4;margin:0;}
  .footer .copyright{font-size:.68rem;color:var(--text-faint);}

  @media (min-width:600px){
    .bio-card{align-items:center;}
    .letter-grid{flex-direction:row;}
    .letter-text{flex:1;}
    .photo-grid{flex:1;}
  }
/* ============================================================
   INTERACTION & ANIMATION EFFECTS
   ============================================================ */

/* Smooth scrolling */
html {
  scroll-behavior: smooth;
}

/* ---------- Scroll reveal ---------- */

.reveal {
  opacity: 0;
  transform: translateY(28px);
  transition:
    opacity .7s ease,
    transform .7s cubic-bezier(.2, .8, .2, 1);
}

.reveal.show {
  opacity: 1;
  transform: translateY(0);
}


/* ---------- Photo card hover ---------- */

.redeem-card {
  cursor: pointer;
  transform: translateY(0) scale(1);
  transition:
    transform .25s cubic-bezier(.2,.7,.2,1),
    box-shadow .25s ease;
}

.redeem-card:hover {
  transform: translateY(-6px) scale(1.025);
  box-shadow: 0 14px 30px rgba(0,0,0,.35);
}

.redeem-card img {
  transition: transform .45s ease;
}

.redeem-card:hover img {
  transform: scale(1.08);
}

/* ---------- Click / press effect ---------- */

.redeem-card:active {
  transform: scale(.96);
}

button:active,
.profile-picker:active,
.flip-card:active {
  transform: scale(.94);
}

/* ---------- Profile intro hover ---------- */

.profile-picker {
  transition:
    transform .3s ease,
    opacity .3s ease;
}

.profile-picker:hover {
  transform: translateY(-5px);
}

.profile-picker .avatar {
  transition:
    transform .3s ease,
    box-shadow .3s ease;
}

.profile-picker:hover .avatar {
  transform: scale(1.06);
  box-shadow: 0 12px 35px rgba(47,214,110,.18);
}

/* ---------- Intro screen transitions ---------- */

#screen-who,
#screen-welcome {
  transition:
    opacity .6s ease,
    transform .6s ease;
}

.intro-exit {
  opacity: 0 !important;
  transform: scale(.96) !important;
  pointer-events: none;
}

.intro-enter {
  animation: introEnter .7s cubic-bezier(.2,.7,.2,1) both;
}

@keyframes introEnter {
  from {
    opacity: 0;
    transform: scale(1.04) translateY(15px);
  }

  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

/* ---------- General section hover ---------- */

.tour-card,
.credits-card,
.share-card,
.next-up-card {
  transition:
    transform .25s ease,
    box-shadow .25s ease;
}

.tour-card:hover,
.credits-card:hover,
.share-card:hover,
.next-up-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 28px rgba(0,0,0,.22);
}

/* ---------- Letter photos ---------- */

.photo-grid .disc {
  transition:
    transform .3s ease,
    box-shadow .3s ease;
}

.photo-grid .disc:hover {
  transform: scale(1.05) rotate(1deg);
  box-shadow: 0 10px 25px rgba(0,0,0,.3);
}

/* ---------- Hero image ---------- */

.hero-art {
  transition:
    transform .4s ease,
    box-shadow .4s ease;
}

.hero-art:hover {
  transform: scale(1.015);
}

/* ---------- Album ---------- */

.flip-card {
  transition:
    transform .7s cubic-bezier(.4,.2,.2,1),
    filter .3s ease;
}

.flip-card:hover {
  filter: brightness(1.08);
}

/* ---------- Staggered reveal ---------- */

.redeem-card:nth-child(1) { transition-delay: .05s; }
.redeem-card:nth-child(2) { transition-delay: .10s; }
.redeem-card:nth-child(3) { transition-delay: .15s; }
.redeem-card:nth-child(4) { transition-delay: .20s; }
.redeem-card:nth-child(5) { transition-delay: .25s; }
.redeem-card:nth-child(6) { transition-delay: .30s; }
</style>
</head>
<body>

<div class="frame">

  <!-- ============ SCREEN 1: Who's listening ============ -->
  <section id="screen-who">
    <p class="eyebrow" id="who-eyebrow">Who's listening?</p>
    <div class="profile-picker" id="profile-picker">
      <div class="avatar"><img id="who-avatar" src="" alt=""></div>
      <p class="pname" id="who-name"></p>
    </div>
  </section>

  <!-- ============ SCREEN 2: Welcome back ============ -->
  <section id="screen-welcome" class="hidden">
    <h1 id="welcome-heading"></h1>
    <div class="avatar-lg"><img id="welcome-avatar" src="" alt=""></div>
<button class="pill-btn" id="welcome-continue"></button>
  </section>

  <!-- ============ MAIN APP ============ -->
  <div id="app" class="hidden">

   

    <!-- HERO -->
    <header class="hero">
      <div class="hero-art"><img id="hero-art" src="" alt=""></div>
      <h1 id="hero-title"></h1>
      <p class="hero-sub" id="hero-subtitle"></p>
      <div id="hero-lines"></div>
      <p class="now-playing" id="hero-nowplaying"></p>
      <div class="hero-controls">
        <div class="preview">&#128266;&nbsp;<span>Preview</span></div>
        <div class="right-icons">
          <span class="icon-btn">&#8226;&#8226;&#8226;</span>
          <span class="icon-btn">&#10133;</span>

<script>
/* ================================================================

/* ================================================================

   line. It reads CONFIG above and fills in the page.

function interp(str){
  if (typeof str !== "string") return str;
  return str.replace(/\{(\w+)\}/g, (_, key) => (key in CONFIG ? CONFIG[key] : `{${key}}`));
}
function set(id, html){ const el = document.getElementById(id); if (el) el.innerHTML = html; }
function setSrc(id, src){ const el = document.getElementById(id); if (el) el.src = src; }
function on(id, evt, fn){ const el = document.getElementById(id); if (el) el.addEventListener(evt, fn); }

function render(){

/* Flip-card tracklist */

/* ---------------- scroll reveal ---------------- */

function setupScrollReveal() {
  const revealElements = document.querySelectorAll(
    ".hero, #about-section, .credits-card, " +
    "#letter-section, .letter-grid, #vvip-section, " +
    ".redeem-card, .next-up, #carousel-section, .footer"
  );

  revealElements.forEach(el => {
    el.classList.add("reveal");
  });

  const revealObserver = new IntersectionObserver(
    entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add("show");
        } else {
          entry.target.classList.remove("show");
        }
      });
    },
    {
      threshold: 0.15
    }
  );

  revealElements.forEach(el => {
    revealObserver.observe(el);
  });

  // Stagger the photo cards
  document.querySelectorAll(".redeem-card").forEach((card, i) => {
    card.style.transitionDelay = `${i * 0.08}s`;
  });
}
  
render();
setupScrollReveal();

/* ---------------- interactions ---------------- */


// screen 1 -> screen 2
on("profile-picker", "click", () => {
  const who = document.getElementById("screen-who");
  const welcome = document.getElementById("screen-welcome");
  
  who.classList.add("intro-exit");
  
  setTimeout(() => {
    who.classList.add("hidden");
    
    welcome.classList.remove("hidden");
    welcome.classList.add("intro-enter");
  }, 600);
});

// screen 2 -> app
on("welcome-continue", "click", () => {
  const welcome = document.getElementById("screen-welcome");
  const app = document.getElementById("app");

  welcome.classList.add("intro-exit");

  setTimeout(() => {
    welcome.classList.add("hidden");

    app.classList.remove("hidden");

    window.scrollTo(0, 0);

    app.classList.add("intro-enter");

    setTimeout(() => {
      app.classList.remove("intro-enter");
    }, 700);
  }, 600);
});

// hero play/pause (visual only — hook up a real <audio> tag if you have a track)
let currentTrack = 0;
let isPlaying = false;

const playerAudio = new Audio();
playerAudio.preload = "metadata";

function updatePlayButton() {
  const button = document.getElementById("play-pause-btn");
  const vinyl = document.getElementById("vinyl");

  if (button) {
    button.innerHTML = isPlaying
      ? "&#10074;&#10074;"
      : "&#9658;";
  }

  if (vinyl) {
    vinyl.classList.toggle("spinning", isPlaying);
  }
}

 function play() {
  playerAudio.play()
    .then(() => {
      isPlaying = true;
      updatePlayButton();
    })
    .catch(error => {
      console.error("Audio could not play:", error);
      isPlaying = false;
      updatePlayButton();
    });
}

function pause() {
  playerAudio.pause();
  isPlaying = false;
  updatePlayButton();
}

function loadTrack(idx, autoplay = false) {
  currentTrack =
    (idx + CONFIG.playlist.length) % CONFIG.playlist.length;


  const t = CONFIG.playlist[currentTrack];

  playerAudio.pause();
  playerAudio.src = t.audio;
  playerAudio.load();

  isPlaying = false;
  updatePlayButton();

  set("player-title", interp(t.title));
  set("player-artist", interp(t.artist));

 setSrc("vinyl-label", t.vinylLabel);
 
  set("progress-elapsed", "0:00");
  set("progress-total", t.duration || "0:00");

  document.getElementById("progress-fill").style.width = "0%";

  document.querySelectorAll("#tracklist li").forEach(li => {
    li.classList.toggle(
      "active",
      Number(li.dataset.idx) === currentTrack
    );
  });

  if (autoplay) {
    play();
  }
}


/* Start without autoplay */
loadTrack(0);

/* ---------------- album flip ---------------- */

on("flip-card", "click", () => {
  const card = document.getElementById("flip-card");
  const player = document.getElementById("player");

  card.classList.toggle("flipped");

  // Reveal the player after the album is flipped
  if (card.classList.contains("flipped")) {
    player.classList.add("visible");
  } else {
    player.classList.remove("visible");
  }
});

/* Play / Pause */
on("play-pause-btn", "click", () => {
  if (isPlaying) {
    pause();
  } else {
    play();
  }
});

 /* Previous / Next */
on("prev-btn", "click", () => {
  loadTrack(currentTrack - 1, true);
});

 /* Read wishes */
on("notif-btn", "click", () => {
  const banner = document.getElementById("notif-banner");
  const letter = document.getElementById("letter-section");

  banner.classList.add("is-read");
  letter.classList.add("revealed");

  setTimeout(() => {
    letter.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }, 100);
});

on("next-btn", "click", () => {
  loadTrack(currentTrack + 1, true);
});

/* Tracklist */
document.getElementById("tracklist").addEventListener("click", e => {
  const li = e.target.closest("li");

  if (!li) return;

  if (e.target.classList.contains("t-heart")) {
    e.target.classList.toggle("liked");

    e.target.innerHTML =
      e.target.classList.contains("liked")
        ? "&#9829;"
        : "&#9825;";

    return;
  }

  loadTrack(Number(li.dataset.idx), true);
});


/* Hero audio */
const heroAudio = new Audio(CONFIG.nowPlayingAudio);

let heroPlaying = false;

on("hero-play", "click", async function () {
  try {
    if (heroPlaying) {
      heroAudio.pause();
      heroPlaying = false;
      this.innerHTML = "&#9658;";
    } else {
      await heroAudio.play();
      heroPlaying = true;
      this.innerHTML = "&#10074;&#10074;";
    }
  } catch (error) {
    console.error("Hero audio could not play:", error);

    heroPlaying = false;
    this.innerHTML = "&#9658;";
  }
});

heroAudio.addEventListener("ended", () => {
  heroPlaying = false;

  const button = document.getElementById("hero-play");

  if (button) {
    button.innerHTML = "&#9658;";
  }
});

playerAudio.addEventListener("timeupdate", () => {
  if (!playerAudio.duration) return;
  
  const percent =
    (playerAudio.currentTime / playerAudio.duration) * 100;
  
  const fill = document.getElementById("progress-fill");
  
  if (fill) {
    fill.style.width = `${percent}%`;
  }
  
  const elapsed = document.getElementById("progress-elapsed");
  
  if (elapsed) {
    const minutes = Math.floor(playerAudio.currentTime / 60);
    const seconds = Math.floor(playerAudio.currentTime % 60)
      .toString()
      .padStart(2, "0");
    
    elapsed.textContent = `${minutes}:${seconds}`;
  }
});

playerAudio.addEventListener("ended", () => {
  isPlaying = false;
  updatePlayButton();
  
  loadTrack(currentTrack + 1, true);
});
